<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hqbot Admin</title>

  <style>
    body {
      background: #080b0a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #111613;
      border: 1px solid #29382f;
      border-radius: 16px;
      padding: 25px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      box-sizing: border-box;
      background: #080b0a;
      color: white;
      border: 1px solid #29382f;
      border-radius: 9px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #20e66b;
      border: none;
      border-radius: 9px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      word-break: break-all;
      text-align: center;
      color: #20e66b;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #ff6868;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Hqbot Admin</h1>

  <input
    id="adminKey"
    type="password"
    placeholder="Admin Secret"
  >

  <button onclick="generateKey()">
    Generate Activation Key
  </button>

  <div id="result"></div>
  <div id="message"></div>

</div>

<script>

const API =
  "https://hqbot-production-b81b.up.railway.app";

async function generateKey() {

  const adminKey =
    document.getElementById("adminKey").value;

  const result =
    document.getElementById("result");

  const message =
    document.getElementById("message");

  result.textContent = "";
  message.textContent = "";

  if (!adminKey) {
    message.textContent =
      "Enter your admin secret.";
    return;
  }

  try {

    const response = await fetch(
      API + "/api/admin/generate-key",
      {
        method: "POST",
        headers: {
          "x-admin-key": adminKey
        }
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      message.textContent =
        data.error || "Failed.";
      return;
    }

    result.textContent =
      data.key;

  } catch (error) {

    message.textContent =
      "Could not connect to Hqbot.";

  }
}

</script>

</body>
</html>

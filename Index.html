
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hqbot — Bedrock Bot Manager</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
}

body{
  background:#080b12;
  color:#f5f7fb;
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:240px;
  background:#0d111a;
  border-right:1px solid #202633;
  padding:22px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
}

.logo{
  font-size:24px;
  font-weight:800;
  margin:5px 10px 30px;
}

.logo span{
  color:#7c5cff;
}

.server-type{
  background:#151b27;
  border:1px solid #252d3b;
  border-radius:10px;
  padding:11px;
  margin:0 5px 25px;
  color:#aeb7c8;
  font-size:12px;
}

.server-type strong{
  display:block;
  color:#fff;
  font-size:13px;
  margin-top:3px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  border:0;
  background:transparent;
  color:#8993a5;
  text-align:left;
  padding:12px 13px;
  border-radius:9px;
  font-size:14px;
}

.nav button:hover,
.nav button.active{
  background:#171d2a;
  color:#fff;
}

.nav button.active{
  border-left:3px solid #7c5cff;
}

/* MAIN */

.main{
  margin-left:240px;
  width:calc(100% - 240px);
}

.topbar{
  height:72px;
  border-bottom:1px solid #202633;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
}

.topbar small{
  color:#7f899b;
}

.add-btn{
  background:#7c5cff;
  border:0;
  color:white;
  padding:11px 17px;
  border-radius:9px;
  font-weight:700;
}

.content{
  padding:30px;
  max-width:1400px;
  margin:auto;
}

.title{
  font-size:28px;
  margin-bottom:7px;
}

.subtitle{
  color:#7f899b;
  margin-bottom:25px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#0d111a;
  border:1px solid #202633;
  border-radius:13px;
  padding:20px;
}

.stat-label{
  color:#7f899b;
  font-size:13px;
}

.stat-value{
  font-size:25px;
  font-weight:800;
  margin-top:8px;
}

/* BOT GRID */

.section
